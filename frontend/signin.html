<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusBoard - Sign In</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Questrial&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/style.css">
    <style type="text/tailwindcss">
        @theme {
            /* CampusBoard palette: #e2d64b #4ab7e0 #0d173b #84ac64 #c2c19f #2d6668 */
            --color-primary: #0d173b;
            --color-primary-hover: #2d6668;
            --color-primary-light: #e6f4fa;
            --color-purple: #2d6668;
            --color-purple-hover: #234f51;
            --color-purple-light: #e3eeee;
            --color-emerald: #84ac64;
            --color-emerald-hover: #6a904d;
            --color-emerald-light: #e8f0df;
            --color-danger: #c2412d;
            --color-danger-light: #fbeeeb;
            --font-sans: 'Century Gothic', 'CenturyGothic', 'AppleGothic', 'Questrial', sans-serif;

            /* Remap Tailwind scales onto the palette */
            --color-indigo-50: #eaf6fb; --color-indigo-100: #d2edf8; --color-indigo-200: #a9dcf0;
            --color-indigo-300: #7fcbe8; --color-indigo-400: #4ab7e0; --color-indigo-500: #2f97c0;
            --color-indigo-600: #1d5f86; --color-indigo-700: #153a66; --color-indigo-800: #0f2550; --color-indigo-900: #0d173b;
            --color-blue-50: #eaf6fb; --color-blue-600: #1d5f86;
            --color-purple-50: #e3eeee; --color-purple-600: #2d6668; --color-purple-700: #234f51;
            --color-emerald-50: #f1f6ec; --color-emerald-200: #c6dab3; --color-emerald-400: #9cbf80;
            --color-emerald-500: #84ac64; --color-emerald-600: #5f8443; --color-emerald-700: #4b6a35;
            --color-green-600: #5f8443; --color-green-700: #4b6a35;
            --color-amber-200: #f1ea9f; --color-amber-400: #e2d64b; --color-amber-500: #cfc13a;
            --color-amber-700: #7d741b; --color-yellow-50: #fcfae6; --color-yellow-600: #8f851f;
            --color-gray-50: #f8f8f3; --color-gray-100: #f0efe6; --color-gray-200: #e3e2d2;
            --color-gray-300: #d0cfb8; --color-gray-400: #9c9b84; --color-gray-500: #6f6f63;
            --color-gray-600: #4f5160; --color-gray-700: #353b52; --color-gray-800: #1c2547; --color-gray-900: #0d173b;
        }
    </style>
</head>

<body class="signin-hero flex items-center justify-center min-h-screen p-4 sm:p-6">

    <div class="signin-card card w-full max-w-md p-6 sm:p-8 space-y-6">
        <div class="text-center">
            <div
                class="signin-logo inline-flex items-center justify-center w-14 h-14 rounded-xl font-extrabold text-2xl mb-3">
                C
            </div>
            <h1 class="text-3xl font-bold tracking-tight text-gray-900">Campus<span class="text-indigo-400">Board</span></h1>
            <p class="text-xs text-gray-500 mt-1 uppercase tracking-[0.2em] font-semibold">Students &amp; Faculty Only</p>
            <div class="signin-palette mt-4 mx-auto w-40" aria-hidden="true">
                <span style="background:#0d173b"></span><span style="background:#4ab7e0"></span><span style="background:#2d6668"></span>
                <span style="background:#84ac64"></span><span style="background:#c2c19f"></span><span style="background:#e2d64b"></span>
            </div>
        </div>

        <!-- Error Alert Box -->
        <div id="errorAlert" class="hidden p-3 text-xs text-red-700 bg-red-50 rounded-md border border-red-200"></div>

        <form id="signinForm" class="space-y-4">
            <div>
                <label class="form-label">Campus Email</label>
                <input type="email" id="email" required class="form-input"
                    placeholder="name@student.campusboard.edu or name@faculty.campusboard.edu">
            </div>

            <div>
                <label class="form-label">Password</label>
                <input type="password" id="password" required class="form-input" placeholder="••••••••">
            </div>

            <button type="submit" class="btn btn-primary w-full py-2.5">
                <i class="bi bi-box-arrow-in-right mr-1.5"></i> Sign In to CampusBoard
            </button>
        </form>

        <div class="border-t border-gray-100 pt-4 text-center">
            <p class="text-xs text-gray-400 leading-relaxed">
                Campus accounts require authorization under <strong>@student.campusboard.edu</strong> or
                <strong>@faculty.campusboard.edu</strong>. Contact your department to get your account.
            </p>
        </div>
    </div>

    <script>
        document.getElementById('signinForm').addEventListener('submit', async function (e) {
            e.preventDefault();
            const errorAlert = document.getElementById('errorAlert');
            errorAlert.classList.add('hidden');

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await res.json();

                if (!res.ok) {
                    errorAlert.textContent = data.message || 'Authentication failed.';
                    errorAlert.classList.remove('hidden');
                    return;
                }

                localStorage.setItem('token', data.token);
                localStorage.setItem('user', JSON.stringify(data.user));
                window.location.href = '/dashboard.html';
            } catch (err) {
                errorAlert.textContent = 'Server connection failed. Verify backend is active.';
                errorAlert.classList.remove('hidden');
            }
        });
    </script>
</body>

</html>
