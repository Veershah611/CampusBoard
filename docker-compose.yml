# One-command local setup: `docker compose up --build`, then open http://localhost:5000
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db

  app:
    build: .
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/campusboard_db
      JWT_SECRET: change-me-to-a-long-random-string
      ROOT_ADMIN_EMAIL: admin@faculty.campusboard.edu
      ROOT_ADMIN_PASSWORD: change-me
    depends_on:
      - mongo

volumes:
  mongo-data:
